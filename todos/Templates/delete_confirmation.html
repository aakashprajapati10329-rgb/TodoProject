{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <title>TaskMaster - Delete Confirmation</title>
</head>
<body>
    <header>
        <h1 class="title">Delete Task</h1>
        <span class="title-badge">Danger Zone</span>
    </header>

    <main class="delete-section">
        <div class="delete-icon">⚠️</div>
        <h2>Are you sure you want to delete this task?</h2>
        <span class="delete-task">"{{ task.title }}"</span>
        <p class="delete-warning">This action is permanent and cannot be undone.</p>
        
        <form action="" method="post" class="delete-form">
            {% csrf_token %}
            <div class="delete-buttons">
                <a href="{% url 'home' %}" class="btn cancel-delete">Cancel</a>
                <button type="submit" class="btn confirm-delete">Yes, Delete</button>
            </div>
        </form>
    </main>
</body>
</html>
